version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexedu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexedu
      POSTGRES_PASSWORD: nexedu123
      POSTGRES_DB: nexedu_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexedu -d nexedu_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
